# nginx site for the update-airlock status page (static, read-only). Install:
#   sudo install -m 644 web/nginx-update-airlock.conf /etc/nginx/sites-available/update-airlock
#   sudo ln -s ../sites-available/update-airlock /etc/nginx/sites-enabled/update-airlock
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8100;
    listen [::]:8100;
    server_name _;
    root /var/www/update-airlock;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
