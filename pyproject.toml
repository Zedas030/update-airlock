[project]
name = "update-airlock"
version = "1.0.0"
description = "Test container updates in an isolated sandbox against a copy of the real config, update in a maintenance window, roll back automatically"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "requests>=2.28"]

[project.scripts]
update-airlock = "update_airlock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
